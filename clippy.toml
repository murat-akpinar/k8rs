# Invariant 1 — writes live in src/ops.rs and nowhere else.
#
# **This file is the containment.** clippy resolves paths, so it knows
# `kube::Api::replace` from `str::replace`; a bare-name grep does not, and the
# grep that used to do this job produced five findings, all false, on the day
# kube arrived (NOTES § D141). With `-D warnings` an entry below is a red build.
#
# It is not hand-maintained. The list is every `&self` method of **`Api<K>` and
# `kube_core::Request`** in the kube version in Cargo.lock, minus invariant 1's
# allowlist (`get*` / `list*` / `watch*` / `logs` / `log_stream` /
# `apiserver_version`), and `scripts/write-guard.py` fails unless this file names
# exactly that set — so a kube bump that adds a method goes red in the same
# commit. When it fails it prints the exact block to paste in place of the one
# below; do not hand-add a line, because a path with a typo in it bans nothing
# and says nothing about it (see below).
#
# **`Request` is here because a write does not have to go through `Api<K>`**
# (NOTES § D142): a `Request` built by hand and posted through `Client::request`
# was a complete DELETE that raised nothing. The allowlist did not widen to
# absorb it — `Request`'s readers are `list`, `watch`, `get`, `get_subresource`,
# `get_metadata`, `list_metadata`, `watch_metadata` and `logs`, so the same rule
# partitions the second type unchanged. `Client` is deliberately absent: its
# `request` and `send` are both verb-agnostic and Phase 5 needs each of them
# outside `ops.rs` for a read — `send` since the `Date` header behind
# `Session::skew`, which is the only call that hands back a response head.
#
# `namespace` and `resource_url` mutate nothing and are here anyway: the
# allowlist is deliberately conservative, and a method is banned by default
# until invariant 1 says otherwise. That is correct, not a bug. `Request::new`
# is *not* here, and needs no exception: it takes no `&self`, so the derivation
# never yields it — which is what keeps Phase 5's hand-built Table request off
# this list without anyone widening anything.
#
# Spellings are `kube::Api::x` and `kube::core::Request::x`. `kube::api::Api::x`
# and `kube_core::request::Request::x` resolve to the same def-ids and would work
# identically; one spelling per type is fixed so the guard can compare strings,
# and both were confirmed by making a call fire, not by reading docs. **A path
# clippy cannot resolve is only a warning, `-D warnings` does not promote it, and
# it is not emitted at all by a crate that does not link kube** — all measured
# (NOTES § D141). So the spellings are checked by write-guard.py against kube's
# own re-exports, every hop, rather than trusted here.
#
# The six `allow-invalid` entries are kube's `ws` feature on both types, which
# D140 leaves off: they cannot compile, so they contain nothing today, and they
# are listed anyway so that turning `ws` on needs no one to remember.
# `allow-invalid` silences the unresolved-path warning for exactly these —
# **because clippy's own help text offers that flag as the fix for that warning,
# and a baseline of permanent warnings is how a real one goes unread.**
# write-guard.py pins the flagged set for the same reason. That the set is
# exactly these six was read off clippy with the flags stripped, not off a
# `#[cfg]`: kube-core's `kubelet-debug` feature is also off and also parsed, but
# its `kubelet_node_*` functions take no `&self` and never enter the list.
#
# `ops.rs` carries the single visible `#![allow(clippy::disallowed_methods)]`
# that announces the exception (Phase 7).
disallowed-methods = [
    { path = "kube::Api::attach", allow-invalid = true },
    "kube::Api::cordon",
    "kube::Api::create",
    "kube::Api::create_subresource",
    "kube::Api::create_token_request",
    "kube::Api::delete",
    "kube::Api::delete_collection",
    "kube::Api::entry",
    "kube::Api::evict",
    { path = "kube::Api::exec", allow-invalid = true },
    "kube::Api::namespace",
    "kube::Api::patch",
    "kube::Api::patch_approval",
    "kube::Api::patch_ephemeral_containers",
    "kube::Api::patch_metadata",
    "kube::Api::patch_resize",
    "kube::Api::patch_scale",
    "kube::Api::patch_status",
    "kube::Api::patch_subresource",
    { path = "kube::Api::portforward", allow-invalid = true },
    "kube::Api::replace",
    "kube::Api::replace_ephemeral_containers",
    "kube::Api::replace_resize",
    "kube::Api::replace_scale",
    "kube::Api::replace_status",
    "kube::Api::replace_subresource",
    "kube::Api::resource_url",
    "kube::Api::restart",
    "kube::Api::uncordon",
    { path = "kube::core::Request::attach", allow-invalid = true },
    "kube::core::Request::cordon",
    "kube::core::Request::create",
    "kube::core::Request::create_subresource",
    "kube::core::Request::delete",
    "kube::core::Request::delete_collection",
    "kube::core::Request::evict",
    { path = "kube::core::Request::exec", allow-invalid = true },
    "kube::core::Request::patch",
    "kube::core::Request::patch_metadata",
    "kube::core::Request::patch_subresource",
    { path = "kube::core::Request::portforward", allow-invalid = true },
    "kube::core::Request::replace",
    "kube::core::Request::replace_subresource",
    "kube::core::Request::restart",
    "kube::core::Request::uncordon",
]
