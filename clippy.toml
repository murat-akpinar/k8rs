# Invariant 1 — writes live in src/ops.rs and nowhere else.
#
# This is the fast local signal: clippy resolves paths, so it catches a write
# call the moment it is typed. It is *not* the containment guarantee — a
# hand-written list of forbidden methods is a denylist, and kube-rs grows new
# ones every release. `scripts/write-guard.py` derives the real ban list from
# the kube version in Cargo.lock, minus the allowlist, and runs in CI.
#
# Entries arrive with the client (Phase 5); `ops.rs` will carry the single
# visible `#![allow(clippy::disallowed_methods)]` that announces the exception.
disallowed-methods = []
