# The deliberately broken pods the rules are written against.
# Comment numbers are the rule numbers in NOTES.md § v1 rule set.
# Applied by scripts/cluster.sh break.

# 2 — OOMKilled (exit 137)
apiVersion: v1
kind: Pod
metadata: { name: broken-oom, labels: { demo: broken } }
spec:
  containers:
    - name: hog
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
      resources:
        limits: { memory: "64Mi" }
---
# 1 + 6 — CrashLoopBackOff, exit 1
apiVersion: v1
kind: Pod
metadata: { name: broken-crashloop, labels: { demo: broken } }
spec:
  containers:
    - name: quitter
      image: busybox
      command: ["sh", "-c", "echo starting; sleep 2; exit 1"]
---
# 3 — ImagePullBackOff
apiVersion: v1
kind: Pod
metadata: { name: broken-image, labels: { demo: broken } }
spec:
  containers:
    - name: nope
      image: registry.invalid/does-not-exist:v9
---
# 4 — CreateContainerConfigError (missing ConfigMap)
apiVersion: v1
kind: Pod
metadata: { name: broken-config, labels: { demo: broken } }
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      envFrom:
        - configMapRef: { name: this-configmap-does-not-exist }
---
# 10 — Pending, unschedulable (insufficient cpu)
apiVersion: v1
kind: Pod
metadata: { name: broken-pending, labels: { demo: broken } }
spec:
  containers:
    - name: greedy
      image: busybox
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "500" }
---
# 8 — hostPath, moreover / and writable → must be CRITICAL
apiVersion: v1
kind: Pod
metadata: { name: broken-hostpath, labels: { demo: broken } }
spec:
  containers:
    - name: nosy
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - { name: root, mountPath: /host }
  volumes:
    - name: root
      hostPath: { path: / }
---
# 7 + 11 — Running but never ready (readiness probe always fails)
apiVersion: v1
kind: Pod
metadata: { name: broken-readiness, labels: { demo: broken } }
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      readinessProbe:
        exec: { command: ["sh", "-c", "exit 1"] }
        periodSeconds: 5
---
# 5 — restarted repeatedly, but Running and ready *now*. Rule 5's whole point is
# the pod that looks fine at a glance, so a crashlooping fixture does not prove
# it: the counter has to survive into a healthy state. The emptyDir is what
# makes that happen — a restarted container gets a fresh filesystem, so a
# counter kept inside it would reset and the pod would crashloop forever.
apiVersion: v1
kind: Pod
metadata: { name: broken-restarts, labels: { demo: broken } }
spec:
  containers:
    - name: flaky
      image: busybox
      command: ["sh", "-c"]
      args:
        - |
          n=$(cat /state/n 2>/dev/null || echo 0)
          n=$((n + 1))
          echo "$n" > /state/n
          [ "$n" -le 3 ] && exit 1
          sleep 3600
      volumeMounts:
        - { name: state, mountPath: /state }
  volumes:
    - name: state
      emptyDir: {}
---
# 9 — no limits. No longer an alert: this is a Capacity report row, and the
# fixture exists to prove the Capacity report, not a finding
apiVersion: v1
kind: Pod
metadata: { name: broken-nolimits, labels: { demo: broken } }
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
---
# 12 — stuck Terminating. The finalizer is never removed by anything, so
# `kubectl delete pod broken-stuck` returns and the pod stays Terminating
# forever — which is exactly the state to capture. Remove it afterwards with
# `kubectl patch pod broken-stuck -p '{"metadata":{"finalizers":null}}'`,
# or the kind cluster will not delete cleanly.
apiVersion: v1
kind: Pod
metadata:
  name: broken-stuck
  labels: { demo: broken }
  finalizers: ["k8rs.test/never-removed"]
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
---
# D27 — an init container that never succeeds. The app container never starts,
# so `containerStatuses` says nothing useful and every pod rule that reads only
# that array is blind to this pod. This is the fixture that proves rules 1-6
# read `initContainerStatuses` as well.
apiVersion: v1
kind: Pod
metadata: { name: broken-init, labels: { demo: broken } }
spec:
  initContainers:
    - name: migrate
      image: busybox
      command: ["sh", "-c", "echo running migrations; sleep 2; exit 1"]
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
---
# D28 / W1 + W2 — the workload whose pods are never created. The quota allows
# zero pods, so the ReplicaSet cannot create any: `kubectl get pods` shows
# nothing, the Deployment sits at 0/1, and the only place the truth exists is the
# ReplicaSet's ReplicaFailure condition. No pod rule can see this.
#
# The same object is W2's fixture once its rollout deadline passes. That deadline
# defaults to 600s, which is longer than `cluster.sh verify` will ever wait, so
# the capture was taken before Progressing could ever flip to
# ProgressDeadlineExceeded — W2 had a fixture that could not hold its state.
# 60s puts it inside the window.
#
# It lives in its own namespace on purpose: a `pods: "0"` quota applies to the
# whole namespace, so leaving it beside the others would block every pod above
# from ever being created again on a re-apply.
apiVersion: v1
kind: Namespace
metadata: { name: k8rs-quota, labels: { demo: broken } }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: deny-all-pods, namespace: k8rs-quota, labels: { demo: broken } }
spec:
  hard: { pods: "0" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: broken-quota, namespace: k8rs-quota, labels: { demo: broken } }
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector: { matchLabels: { app: broken-quota } }
  template:
    metadata: { labels: { app: broken-quota, demo: broken } }
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
