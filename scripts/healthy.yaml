# The negative side of every rule. A rule with only a positive fixture cannot
# fail in the one direction that matters: firing on a pod that is fine.
# Applied together with broken.yaml by `scripts/cluster.sh break`.

# A pod that is genuinely healthy: running, ready, limits set, no host mounts,
# no restarts, an init container that *succeeds*.
apiVersion: v1
kind: Pod
metadata: { name: healthy, labels: { demo: healthy } }
spec:
  initContainers:
    - name: migrate
      image: busybox
      command: ["sh", "-c", "echo migrations done; exit 0"]
      # D40: the spec lookup reads `initContainers` as well as `containers`, and
      # no captured init container declared resources at all — so dropping the
      # first list from the chain changed nothing any test could see. A
      # migration container with a memory limit is an ordinary object, and rule 2
      # has to be able to name the limit an init container exceeded.
      resources:
        requests: { cpu: "50m", memory: "16Mi" }
        limits: { memory: "128Mi" }
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      readinessProbe:
        exec: { command: ["true"] }
        periodSeconds: 5
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits: { cpu: "100m", memory: "64Mi" }
---
# A workload that rolled out cleanly — the negative side of W1 and W2: pods
# exist, the ReplicaSet has no ReplicaFailure, Progressing is not stalled.
apiVersion: apps/v1
kind: Deployment
metadata: { name: healthy-deploy, labels: { demo: healthy } }
spec:
  replicas: 2
  selector: { matchLabels: { app: healthy-deploy } }
  template:
    metadata: { labels: { app: healthy-deploy, demo: healthy } }
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
---
# D46 — the posture case, and it belongs on the healthy side because rule 8 fires
# on a *writable* host mount. Nothing today catches a decode that always answers
# "writable": the one captured hostPath mount sets no `readOnly` key at all, so
# hardwiring `false` passes every assertion it can make — while turning every CNI
# and CSI agent in a real cluster into a CRITICAL finding.
#
# Its own pod rather than a second mount on `healthy`: that pod is the negative
# fixture for every rule at once and its whole description is "running, ready,
# limits set, **no host mounts**". Giving it a hostPath would make rule 8's
# negative assert nothing — `broken-hostpath` and the healthy twin would both
# carry one — which is a false-positive test paid for with a false-negative one.
apiVersion: v1
kind: Pod
metadata: { name: healthy-hostpath, labels: { demo: healthy } }
spec:
  containers:
    - name: reader
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - { name: hostlog, mountPath: /host/log, readOnly: true }
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits: { cpu: "100m", memory: "64Mi" }
  volumes:
    - name: hostlog
      hostPath: { path: /var/log }
---
# D46/D51 — the native sidecar: an init container with `restartPolicy: Always`.
# GA since 1.29, and how Istio, Linkerd and the Vault agent run. The scheduler
# charges it additively — `max(max over the init prefix, sum(regular) + sum(
# restartable init))` — so reading it as an ordinary init container either
# overstates a 2Gi migration container or drops 100m from every pod on a meshed
# node, and "the init container istio-proxy is crashlooping" is not plain
# language, it is false.
#
# Its own pod, again for what the alternative would cost: `healthy`'s `migrate`
# runs to completion, and an init container that exits 0 under `restartPolicy:
# Always` is restarted forever — the pod would climb a restart count and stop
# being the never-restarted negative rule 5 is tested against. A sidecar is a
# process that keeps running, so this one does.
apiVersion: v1
kind: Pod
metadata: { name: healthy-sidecar, labels: { demo: healthy } }
spec:
  initContainers:
    - name: proxy
      image: busybox
      command: ["sleep", "3600"]
      restartPolicy: Always
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits: { cpu: "100m", memory: "64Mi" }
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits: { cpu: "100m", memory: "64Mi" }
---
# D51/KEP-2837 — the pod that declares its own request, which no manifest here
# did. A pod asking for `cpu: 100m` at the pod level with the containers asking
# for less decodes as all-`None` under a container-only read, N5 sums zero, and
# the node is called healthy while committed CPU sits invisible. When the
# pod-level value is set it *replaces* the container sum rather than adding to
# it, so both numbers have to survive the capture — which is why the container
# keeps requests of its own.
#
# Beta and default-on from 1.34; the cluster is pinned at v1.36.1. Where the gate
# is off the API rejects this pod rather than dropping the field quietly.
apiVersion: v1
kind: Pod
metadata: { name: healthy-podlevel, labels: { demo: healthy } }
spec:
  resources:
    requests: { cpu: "100m", memory: "64Mi" }
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits: { cpu: "100m", memory: "64Mi" }
