[package]
name = "k8rs"
version = "0.0.0"
edition = "2024"
# 1.85 until 2026-08-14, when C1's certificate parser forced it up: the only
# `time` release that fixes RUSTSEC-2026-0009 needs 1.88 (NOTES § D86).
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "The Kubernetes TUI in Rust — says what is broken in your cluster and why, in plain English."
repository = "https://github.com/murat-akpinar/k8rs"
keywords = ["kubernetes", "tui", "k8s", "cluster", "terminal"]
categories = ["command-line-utilities"]
exclude = ["screens/", "scripts/", "tmp/", "docs/", "NOTES.md", "REQUIREMENTS.md", "todo.md", "CLAUDE.md"]

# Dependencies arrive with the step that uses them (invariant 10): k8s-openapi
# in Phase 3, kube in Phase 5, ratatui/crossterm in Phase 11.

[dependencies]
# The API types the rule engine reads fields off, and — through its own
# re-export — the `jiff::Timestamp` that `Snapshot::now` is
# ([NOTES § D18](NOTES.md)). Pinned to the *newest* feature the crate offers
# ([NOTES § D99](NOTES.md)): a pin below the cluster drops every field added
# since, silently, which is the one failure a diagnosis tool cannot afford — a
# pin above it yields `None`, which every rule already handles — with two
# exceptions D99 names, both outside our surface today. The reverse rule
# held until 2026-08-15 and was two minors below the fixtures the whole time;
# `scripts/fixture-audit.sh` now compares this line with
# `tests/fixtures/K8S_VERSION`. Upgraded together with kube-rs, never separately.
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
x509-parser = "0.18.1"

# The client and the watch machinery Phase 5 is built on. **4.2.0 is the version
# that pairs with the pin above**, read off the crates.io index rather than
# guessed: kube 4.x requires `k8s-openapi ^0.28.0` and 3.1.0 requires `^0.27.0`,
# and the two are upgraded together, never separately (`docs/tech-stack.md`).
#
# **`rustls-tls`, and the features are named rather than inherited**
# ([NOTES § D140](NOTES.md)). `default-features = false` keeps `oauth`, `oidc`,
# `socks5`, `ws` and a second TLS backend out of a binary whose whole trust model
# is one kubeconfig and one API server — the fewer doors compiled in, the fewer
# there are to audit. `client` brings discovery with it; there is no separate
# feature for it.
kube = { version = "4.2.0", default-features = false, features = [
    "client",
    "runtime",
    "rustls-tls",
    # **`rustls-tls` alone does not make a working TLS client, and dropping this
    # is what D140's feature list got wrong** ([NOTES § D165](NOTES.md)).
    # rustls 0.23 has no built-in crypto and panics at `Client::try_from` —
    # *"Could not automatically determine the process-level CryptoProvider"* —
    # unless exactly one of `ring` / `aws-lc-rs` is compiled in. It is not a
    # second TLS backend, which is what D140 meant to keep out; it is the first
    # one's arithmetic. `ring` and not `aws-lc-rs` because it is kube's own
    # default and needs no cmake or NASM, which `just cross`'s four targets do
    # not have. It adds no `[[package]]` to `Cargo.lock`: `ring` was already
    # resolved there, feature-gated out of the build.
    "ring",
] }

# Required by kube-rs, and later the single `select!` loop. Two features now —
# a runtime and `#[tokio::main]`; `signal` and `time` arrive with the box that
# needs them rather than being reserved here.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }

# **The eleventh crate, and the one reversal of invariant 10**
# ([NOTES § D143](NOTES.md)). Every entry point in `kube-runtime` returns
# `impl Stream` and `Stream` is not in `std`, so the ten approve a client and
# nothing that can consume it. This adds no compiled code: `futures-util` is
# already linked under `kube-client`. The facade `futures` would bring channels,
# sinks, executors and `io` for the one trait we need, so this is the narrow one.
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
] }

[dev-dependencies]
# **Named because our test code uses them, not because the build lacked them**
# ([NOTES § D165](NOTES.md)) — the shape D143 argued for `futures-util`. Measured
# with `cargo tree -e features -i tokio`: `net` and `io-util` are **already on in
# every build**, release included, because `hyper-util` turns them on under
# `kube-client`. So this line adds no compiled code; what it adds is the right to
# write `tokio::net` in our own file instead of silently inheriting a transitive
# crate's feature choice, which is a thing that can change under us in a patch
# release. It sits in `[dev-dependencies]` because k8rs itself never binds a
# socket: the one user is the stub API server that exercises § EVERY KIND THE
# CLUSTER SERVES' legacy fallback, the branch a supported-with-a-note pre-1.27
# cluster reaches and no other test can (D149, D152 failure 1).
tokio = { version = "1.53.1", features = ["net", "io-util"] }

# Only the fixture tests parse JSON in Phase 3 — the decode they exercise is
# `serde` into `k8s_openapi::api::core::v1::Pod`. It moves up to a real
# dependency in Phase 5, where `k8s.rs` builds the browser's Table request by
# hand and decodes the answer with it. **It did not**: `k8s-openapi` re-exports
# both `serde` and `serde_json` (`lib.rs:242-243`), which is the door `jiff`
# already comes through in that file, so the Table decode named no new
# dependency at all (2026-08-22).
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
# No `panic = "abort"`: the terminal is restored by a Drop guard as well as a
# panic hook (REQUIREMENTS § Error states), and Drop does not run when a panic
# aborts instead of unwinding. A corrupted terminal is a worse bug than a
# slightly larger binary — invariant 8.
