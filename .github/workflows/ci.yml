name: CI

on:
  push:
    # development is where every box lands (NOTES § D32). Without it here, a
    # phase's worth of commits would reach CI only when the phase-close PR
    # opens — the drift this file exists to catch, found a phase late.
    branches: [main, development]
  pull_request:

# Least privilege by default; no job here needs more (REQUIREMENTS § CI security).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # **The one place the toolchain version is written**, and it is a version and
  # never a channel. This said `toolchain: stable` until 2026-09-03, and
  # `stable` moved under it twice inside one phase — rustc 1.97.x, then 1.98.0
  # on 2026-08-27, then 1.98.1 on 2026-09-01. clippy 1.98 extended
  # `result_large_err` to `async fn`, two functions nobody had touched went red,
  # and because the dev machine's clippy was 1.97.1 `just check` could not fail
  # on it: green here, red on every one of ~30 pushes, found at the phase-close
  # PR. "`just check` is the whole of CI, or it is a lie" — it was a lie, and
  # `toolchain: stable` is how (NOTES § D211).
  #
  # `scripts/toolchain-guard.py` holds this together: it refuses a channel here,
  # refuses a `dtolnay/rust-toolchain` step that does not read this value, and
  # refuses a local `rustc` that is not this version. It runs on the runner too,
  # where it asserts the action actually honoured the pin.
  #
  # **TO BUMP:** change this one line, run `just check`, read what the newer
  # clippy found, fix it, commit. That is the whole procedure and it is manual
  # on purpose — a new lint arrives when somebody chooses, not on a Tuesday.
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  check:
    name: fmt · clippy · test · guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked --all-targets

      # ONE step, and it deliberately names no guard. The nine steps that used
      # to be here were a second hand-written copy of the guard list, and a copy
      # drifts: `todo-guard.py` reached `just check` and never ran on a push, so
      # a guard that had been proved red-then-green was not guarding anything
      # (NOTES § D26, D111). Adding a guard is now one line in
      # `scripts/guards.sh`, in one place, and it runs here by construction —
      # there is nothing left here to forget to update.
      #
      # The script rather than `just guards`: `just` is not on the runner image
      # and this was its only use in CI, so installing it means a fourth
      # third-party action for an entry point a shebang gives away free
      # (NOTES § D111). `just guards` calls the same script, so the local run and
      # this one cannot differ. The script asserts that `just check` still calls
      # it and names no `scripts/` guard directly.
      #
      # A step that fails with no name is worse at 3am, so the script runs under
      # `set -x`: the last traced `+ python3 scripts/…` line in this step's log
      # IS the guard that failed. The names moved into the script beside the
      # guards they explain, which is also where they stop drifting.
      - name: guards (scripts/guards.sh — the one list)
        run: bash scripts/guards.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources bans

  cross:
    name: check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # This matrix is the one list of release targets: `just cross` reads the
      # `- target:` lines straight out of this file rather than keeping a second
      # copy that could drift (NOTES § D66). Add a target here and the local
      # gate picks it up; reformat these lines and `just cross` fails loudly
      # rather than checking an empty list.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # **An ARM runner, and the reason is a compiler name.** `ring`'s build
          # script asks cc-rs for `<arch>-linux-musl-gcc` by that exact name, and
          # Ubuntu's `musl-tools` ships it for the architecture the package is
          # built for and no other — measured: amd64 gives
          # `x86_64-linux-musl-gcc`, arm64 gives `aarch64-linux-musl-gcc`. So
          # this row builds natively rather than pulling a cross toolchain from
          # a third-party host, which would put a new hostname in front of the
          # supply chain for one `cargo check` (NOTES § D211).
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # **`ring` has a C build script, and that is what broke both musl rows.**
      # It arrived in the *build graph* on 2026-08-27 when D165 turned kube's
      # `ring` feature on — not in `Cargo.lock`, where it had been resolved and
      # feature-gated out for weeks, which is why D165's "adds no `[[package]]`"
      # measurement was true and still missed this. cc-rs then looked for
      # `x86_64-linux-musl-gcc` / `aarch64-linux-musl-gcc`, the runner has
      # neither, and both rows failed in the build script — before link time,
      # where this job was watching. They were red on every push for seven days
      # (NOTES § D211).
      #
      # Ubuntu's own `musl-tools` is the whole fix and adds no hostname the
      # runner image does not already trust. The darwin rows need nothing: they
      # never reach a musl libc.
      - name: musl C toolchain for ring's build script
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Check only, not test: cross-compilation breaks at link time and it
      # breaks late, so it is watched from day one — cheaply.
      - run: cargo check --locked --target ${{ matrix.target }} --all-targets
