name: CI

on:
  push:
    # development is where every box lands (NOTES § D32). Without it here, a
    # phase's worth of commits would reach CI only when the phase-close PR
    # opens — the drift this file exists to catch, found a phase late.
    branches: [main, development]
  pull_request:

# Least privilege by default; no job here needs more (REQUIREMENTS § CI security).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test · guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked --all-targets

      # Green tests are not the same as tests that ran (NOTES § D26).
      - name: honest-test guard
        run: |
          python3 scripts/test-guard.py --self-test
          python3 scripts/test-guard.py

      # Invariant 1, as an allowlist derived from the kube version in the lock
      # file — never a hand-written denylist.
      - name: write containment
        run: |
          python3 scripts/write-guard.py --self-test
          python3 scripts/write-guard.py

      # Every fixture is trusted because a jq predicate in cluster.sh said it
      # reached the state its rule is about. Those predicates only ever ran
      # against a live cluster, where too-loose and too-tight look identical.
      - name: fixture-state predicates
        run: bash scripts/verify-test.sh

      # The sanitizer is a security control: it is fed a poisoned object and
      # must hand back nothing secret (todo.md, Phase 2 § Security gate).
      - name: fixture sanitizer
        run: bash scripts/sanitize-test.sh

      # The certificate fixtures claim pinned dates; C1's positive and negative
      # tests can only fail while that claim stays true (NOTES § D30).
      - name: certificate fixture dates
        run: bash scripts/certs-test.sh

      # sanitize-test proves the filter; this proves the committed bytes. A
      # fixture can reach tests/fixtures/ without ever meeting the filter.
      - name: committed fixtures carry nothing secret
        run: |
          bash scripts/fixture-audit.sh --self-test
          bash scripts/fixture-audit.sh

      - name: docs links and anchors
        run: |
          python3 scripts/check-docs.py --self-test
          python3 scripts/check-docs.py

      # The mockups are the spec views.rs has to match, and "fits 80x24" was a
      # claim nobody had measured. Measured in display columns, not bytes.
      - name: screen mockups fit 80x24
        run: |
          python3 scripts/screens-check.py --self-test
          python3 scripts/screens-check.py

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources bans

  cross:
    name: check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # This matrix is the one list of release targets: `just cross` reads the
      # `- target:` lines straight out of this file rather than keeping a second
      # copy that could drift (NOTES § D66). Add a target here and the local
      # gate picks it up; reformat these lines and `just cross` fails loudly
      # rather than checking an empty list.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Check only, not test: cross-compilation breaks at link time and it
      # breaks late, so it is watched from day one — cheaply.
      - run: cargo check --locked --target ${{ matrix.target }} --all-targets
